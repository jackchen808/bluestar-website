<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Star icon -->
  <g transform="translate(8,12)">
    <polygon points="18,0 23,12 36,12 26,20 29,33 18,25 7,33 10,20 0,12 13,12" fill="url(#starGrad)"/>
  </g>
  <!-- BLUESTAR text -->
  <text x="58" y="38" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="url(#textGrad)" letter-spacing="1">BLUESTAR</text>
  <!-- Tagline -->
  <text x="58" y="56" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#6B7280" letter-spacing="0.5">Data Center Infrastructure · Full Lifecycle Services</text>
  <!-- Small decorative line -->
  <line x1="58" y1="62" x2="260" y2="62" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
