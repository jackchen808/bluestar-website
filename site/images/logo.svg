<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" width="200" height="52">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Star icon -->
  <g transform="translate(4, 4)">
    <!-- Outer star -->
    <polygon points="22,0 27.5,8.5 37,9.5 30,16.5 32,26 22,21.5 12,26 14,16.5 7,9.5 16.5,8.5"
             fill="url(#starGrad)" />
    <!-- Inner highlight -->
    <polygon points="22,5 25.5,10 31,10.5 27,14.5 28,19.5 22,16.5 16,19.5 17,14.5 13,10.5 18.5,10"
             fill="#dbeafe" opacity="0.6" />
    <!-- Small dot accent -->
    <circle cx="22" cy="10" r="2" fill="#ffffff" opacity="0.8" />
  </g>
  <!-- BLUESTAR text -->
  <text x="50" y="33" font-family="'Inter','Segoe UI','Arial',sans-serif"
        font-size="22" font-weight="700" fill="url(#textGrad)" letter-spacing="1.5">BLUESTAR</text>
  <!-- Subline -->
  <text x="50" y="46" font-family="'Inter','Segoe UI','Arial',sans-serif"
        font-size="8" font-weight="500" fill="#64748b" letter-spacing="2">数据センターインフラ フルライフサイクル</text>
</svg>
